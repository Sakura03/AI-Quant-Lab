engine:
  seed: 7
  n_jobs: 2

data:
  root: data
  universe:
    - BTC/USDT
    - ETH/USDT
  exec_tf: 1m
  signal_tfs: [15m, 1h]
  regime_tfs: [4h]
  start: "20230101-000000"
  end: "20230501-000000"
  warmup_bars: 300
  timestamp_semantics: close

split:
  train_months: 1
  val_months: 1
  test_months: 1
  step_months: 1
  embargo_days: 1

strategies:
  enabled: [trend_following, mean_reversion, hybrid_regime_switch]
  per_strategy_max_positions: 2

portfolio:
  initial_balance: 30000
  max_gross_leverage: 1.4
  max_total_positions: 3
  max_symbol_weight: 0.5
  target_vol_annual: 0.16
  dd_soft: 0.08
  dd_hard: 0.15
  min_risk_scale: 0.25
  risk_per_trade: 0.008

costs:
  fee_rate: 0.0005
  slippage_bps: 2.0
  funding_enabled: true

optimizer:
  trials_per_window: 12
  population: 6
  elite_top_k: 3
  prior_adoption_prob: 0.7
  mutation_strength: 0.2
  crossover_prob: 0.3
  min_trades_per_window: 4

objective:
  weights:
    sharpe: 1.0
    max_drawdown: 2.2
    turnover: 0.10
    overfit_gap: 0.2
    concentration: 0.4
  hard_limits:
    max_drawdown: 0.25

output:
  dir: results/trading_enterprise
